<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>My Time Tracker</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><h1>My Time Tracker</h1><p>Meditation · Gym · Reading</p></header>
<section id="login-section" class="panel"><h2>Login</h2><form id="login-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Log in</button></form></section>
<div id="private-content" hidden><div class="session"><span id="signed-in-as"></span><button type="button" id="logout" class="secondary">Log out</button></div>
<section class="panel"><h2>Activity Timer</h2><label>Activity<select id="timer-activity"><option>Meditation</option><option>Gym</option><option>Reading</option></select></label><div id="clock" class="clock" role="timer" aria-live="off">00:00:00</div><div class="buttons"><button type="button" id="start-timer">Start</button><button type="button" id="stop-timer" disabled>Stop &amp; save</button></div><p class="hint">Stopping rounds up to the nearest whole minute. The timer runs while the page stays open.</p></section>
<section class="panel"><h2>Manual Entry</h2><form id="manual-form"><label>Activity<select id="manual-activity"><option>Meditation</option><option>Gym</option><option>Reading</option></select></label><div class="two"><label>Date<input type="date" id="manual-date" required></label><label>Minutes<input type="number" id="manual-minutes" min="1" max="1440" step="1" required></label></div><button type="submit">Save activity</button></form></section>
<section class="panel"><h2>Daily Summary</h2><p id="today-label" class="hint"></p><div id="daily-totals" class="summary"></div><h3>Weekly progress</h3><p id="week-label" class="hint"></p><div id="weekly-progress"></div></section>
<section class="panel"><h2>History</h2><div class="history-scroll"><table><thead><tr><th>Date</th><th>Activity</th><th>Minutes</th></tr></thead><tbody id="history-body"></tbody></table></div></section>
</div><p id="status" role="status" aria-live="polite"></p></main><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
